<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WK Store</title>
  <style>
    :root{--bg:#f7f4ee;--card:#fffdf8;--edge:#e5ddcd;--ink:#231c14;--mute:#665a49;--pri:#ea580c;--pri2:#f59e0b}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;font:16px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--bg)}
    .wrap{min-height:100%;padding:1.1rem 1.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center}
    .bar{display:flex;align-items:center;gap:.6rem;padding:.55rem .9rem;margin-bottom:1rem;background:#fffdf8;border:1px solid var(--edge);border-radius:20px}
    .mark{width:2.6rem;height:2.6rem;border-radius:14px;background:linear-gradient(135deg,var(--pri),var(--pri2))}
    .brand{font-size:1.35rem;font-weight:800}
    .brand b{color:var(--pri)}
    .card{width:100%;max-width:720px;margin:0 auto;text-align:center;background:var(--card);border:1px solid var(--edge);border-radius:28px;padding:2rem 1.6rem 1.5rem;box-shadow:0 6px 20px rgba(60,45,25,.06)}
     .jb-lock{display:block;margin:0 auto 1rem;width:7.5rem;height:7.5rem;object-fit:contain}
    .title{font-size:1.6rem;font-weight:800;margin-bottom:.35rem}
    .title span{color:var(--pri)}
    .meta{color:var(--mute);font-weight:700;margin-bottom:1rem}
    .ring{width:8.5rem;height:8.5rem;margin:0 auto 1rem;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--pri) 0deg,#f4efe5 0);box-shadow:inset 0 0 0 10px var(--card)}
    .ring i{width:6.2rem;height:6.2rem;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:800}
    .status{margin:0 0 .8rem;font-size:1.1rem;font-weight:800;color:var(--pri)}
    .track{height:14px;border-radius:999px;background:#f4efe5;border:1px solid #cfc2ab;overflow:hidden;position:relative}
    .barfill{position:absolute;inset:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transform:scaleX(0);transform-origin:left center}
    .elapsed{margin-top:.7rem;color:var(--mute);font-weight:700}
    .ok,.bad{display:none;margin:.6rem auto 0;max-width:22rem;padding:.7rem .9rem;border-radius:12px;font-weight:800}
    .ok{background:transparent;border:none;color:#047857;font-size:1.15rem;padding:.4rem 0}
    .bad{background:rgba(185,28,28,.08);border:1px solid rgba(185,28,28,.28);color:#b91c1c}
    body.done .ok{display:block} body.fail .bad{display:block}
    body.done .status,body.fail .status{display:none}
    #console{display:none;max-height:7rem;overflow:auto;margin:0.6rem 1.4rem 1rem;padding:0.5rem 0.7rem;font:12px/1.35 ui-monospace,monospace;background:#1a1a1a;color:#c8c8c8;border-radius:8px;white-space:pre-wrap}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="card">
            <img class="jb-lock" src="jb-lock.png" width="120" height="120" alt="">
      <div class="title"><span>WK</span> Store</div>
      <p class="meta" id="metaMsg">chain Wobkot</p>
      <p class="status" id="statusMsg">Jailbreak started</p>
      <div class="ok" id="successMsg">Jailbreak Successful</div>
      <div class="bad" id="failMsg">Failed. Restart the console</div>
      <div class="track"><div class="barfill" id="progressBar"></div></div>
      <p class="elapsed" id="elapsedMsg"></p>
    </section>
  </div>
  <div id="console"></div>
  <script>
    window.LOADER_CONFIG = {
      KEXP_BIN: "payloads/kexp.bin",
      ELFLDR_ELF: "payloads/elfldr.elf",
      STORE_ELF: "1.2.4"
    };
  </script>
  <script src="./src/wobkot_bootstrap.js"></script>
  <script src="./vendor/wobkot/src/misc.js"></script>
  <script src="./vendor/wobkot/src/ps5/impl.js"></script>
  <script src="./vendor/wobkot/src/userland.js"></script>
  <script src="./src/int64.js"></script>
  <script src="./src/wobkot_adapter.js"></script>
  <script src="./site.js"></script>
</body>
</html>
